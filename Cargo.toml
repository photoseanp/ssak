[package]
name = "ssak"
version = "0.1.0"
edition = "2021"
description = "SATEC Swiss Army Knife - набор инструментов для расчёта фильтрационных характеристик"
authors = ["SATEC"]

[[bin]]
name = "ssak"
path = "src/main.rs"

[dependencies]
dialoguer = "0.11"
console = "0.15"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
strip = true
